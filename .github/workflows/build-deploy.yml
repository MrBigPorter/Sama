name: Build & Deploy

on:
  push:
    branches:
      - test       # → staging build + OTA update
      - main       # → production build
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.resolve.outputs.flavor }}
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - id: resolve
        run: |
          BRANCH="${{ github.ref_name }}"
          FLAVOR="${{ github.event.inputs.environment }}"
          if [ -z "$FLAVOR" ]; then
            [ "$BRANCH" = "test" ] && FLAVOR="staging" || FLAVOR="production"
          fi
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          PROFILE="$([ "$FLAVOR" = 'staging' ] && echo 'preview' || echo 'production')"
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT

  build-ios:
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: EAS Build iOS
        run: eas build --profile ${{ needs.resolve.outputs.profile }} --platform ios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-android:
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: EAS Build Android
        run: eas build --profile ${{ needs.resolve.outputs.profile }} --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Staging only: push OTA update after build completes
  update-staging:
    needs: [resolve, build-ios, build-android]
    if: ${{ needs.resolve.outputs.flavor == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push staging OTA update
        run: 'eas update --branch staging --message "CI: $(git log -1 --pretty=%s)"'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Production: also push OTA update after build
  update-production:
    needs: [resolve, build-ios, build-android]
    if: ${{ needs.resolve.outputs.flavor == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push production OTA update
        run: 'eas update --branch production --message "CI: $(git log -1 --pretty=%s)"'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Production only: submit iOS binary to App Store Connect
  submit-ios:
    needs: [resolve, build-ios]
    if: ${{ needs.resolve.outputs.flavor == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Submit iOS to App Store Connect
        run: eas submit --platform ios --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Production only: submit Android AAB to Google Play Console
  submit-android:
    needs: [resolve, build-android]
    if: ${{ needs.resolve.outputs.flavor == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Submit Android to Google Play Console
        run: eas submit --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
